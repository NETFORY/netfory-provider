[package]
name = "netfory-provider"
version = "0.6.2"
edition = "2021"
description = "SmartNet API Bridge & Router — децентрализованный P2P-прокси (протокол api://) поверх Iroh"
license = "MIT"

[[bin]]
name = "netfory-provider"
path = "src/main.rs"

[dependencies]
# --- P2P-стек (совместим с клиентом SmartNet: iroh 1.0 + gossip 0.101) ---
iroh = "1"
iroh-gossip = "0.101"
n0-future = "0.3"

# --- Асинхронный рантайм ---
tokio = { version = "1", features = ["full"] }

# --- HTTP: прокси в клирнет (reqwest) + локальный статус-сервер (axum) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"

# --- Сериализация ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"

# --- Криптография: BIP-39 + Ed25519 (единый корень-сид) ---
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"

# --- Локальная встроенная БД (peers.dat) ---
sled = "0.34"

# --- Утилиты ---
anyhow = "1"
thiserror = "1"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-mainline-address-lookup = "0.4"
n0-mainline = "0.5"

# --- WebSocket-туннель к апстриму (v0.5+) ---
# `tokio-tungstenite` — асинхронный WS-клиент/сервер поверх tokio.
# `futures-util` нужен для `SinkExt::send` / `StreamExt::next` при
# двунаправленном пайпинге WS <-> iroh bi-stream.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
