# =====================================================================
#  netfory-provider - пример конфигурации (config.yaml)
# ---------------------------------------------------------------------
#  ВАЖНО: если запустить провайдер БЕЗ config.yaml (или с пустыми
#  ключами identity), приложение само сгенерирует BIP-39 мнемонику,
#  выведет из неё детерминированный Ed25519-ключ (это и NodeID, и ключ
#  подписи данных) и запишет всё обратно в config.yaml. Этот файл -
#  лишь образец того, как выглядит итоговый конфиг.
# =====================================================================

identity:
  # 12 слов BIP-39. Пусто => будет сгенерировано автоматически при старте.
  bip39_mnemonic: ""
  # Hex 32-байтного корневого ключа, выведенного из мнемоники.
  # Пусто => будет вычислено из bip39_mnemonic и записано сюда.
  iroh_secret_key: ""

network:
  # UDP-порт iroh/QUIC для ПРЯМЫХ подключений.
  #   • число (напр. 11204 / 4433) - фиксированный порт. Откройте его (UDP)
  #     в фаерволе VPS И в панели хостинга, чтобы клиенты били напрямую.
  #     4433 - удобная маскировка под стандартный TLS/QUIC.
  #   • random / auto / 0 - случайный порт (связь через relay/holepunch,
  #     ничего открывать не нужно). Значение по умолчанию.
  #   Игнорируется, если задан непустой список `relays` (relay-only режим).
  #   Текущий порт виден в /status -> quic_udp_port и на дашборде.
  listen_port: random

  # Свои relay-серверы (проект smartnet-relay). Если список НЕ пуст -
  # провайдер работает ТОЛЬКО через relay: прямые UDP-подключения отключаются,
  # реальный IP origin-сервера клиентам НЕ раскрывается (видят только relay).
  # Клиентам ничего настраивать не нужно - они узнают relay провайдера через
  # discovery по NodeID. Relay должны быть iroh-совместимы и доступны по HTTPS.
  # Пусто (по умолчанию) - прямые подключения + публичные n0-relay.
  relays: []
  #   - https://relay-ru1.sth.cx
  #   - https://relay-fsn7.sth.cx

  # Mainline DHT (pkarr) discovery - БЕССЕРВЕРНОЕ обнаружение узлов через
  # распределённую сеть BitTorrent. Клиенты находят провайдер по NodeID без
  # зависимости от серверов n0/n1 (релеи остаются транспортным fallback за NAT).
  # По умолчанию ВКЛ (true). Адреса в DHT публикуются по фильтру relay-only,
  # поэтому реальный IP не раскрывается. Кол-во DHT-узлов видно на дашборде.
  # ВАЖНО: для DHT нужен ИСХОДЯЩИЙ UDP (к публичным роутерам :6881 и др.).
  # Если он закрыт на VPS - DHT не забутстрапится (см. лог-предупреждение),
  # тогда либо откройте UDP, либо задайте dht_bootstrap ниже, либо false.
  # Примечание для relay-only: участие в DHT раскрывает IP сервера ДРУГИМ
  # DHT-узлам (не клиентам). Для максимальной приватности - false или VPN.
  dht_enabled: true

  # Кастомные bootstrap-узлы Mainline DHT (host:port), добавляются к дефолтным
  # публичным роутерам. Полезно, когда дефолтные недостижимы. Объединяются с
  # кэшем живых узлов (dht_boot.dat), который провайдер накапливает сам.
  dht_bootstrap: []
  #   - 67.215.246.10:6881
  #   - dht.smartnet.example:6881

  # Слушать также IPv6 (`[::]:listen_port`) вместе с IPv4. По умолчанию ВКЛ.
  # На VPS с публичным IPv6 это исключает WARN
  # `IPv4 address detected by QAD varies by destination` в CGNAT-сетях и
  # позволяет клиентам подключаться напрямую по v6, минуя relay/holepunch.
  # ОТКРОЙТЕ UDP-порт listen_port ДЛЯ ОБЕИХ семей (v4 + v6) в фаерволе:
  #   ip6tables -A INPUT -p udp --dport <listen_port> -j ACCEPT
  #   iptables  -A INPUT -p udp --dport <listen_port> -j ACCEPT
  # Отключить: false (например, если порт v6 занят другим процессом).
  ipv6_enabled: true

# Локальный HTTP-эндпоинт мониторинга (дашборд + JSON).
status:
  http_port: 8080

# Параметры анонса в P2P-сеть (gossip).
gossip:
  announce_interval_secs: 300   # как часто анонсировать подписанный манифест

# Локальные провайдеры в клирнете, которые мы проксируем.
# Ключ карты - произвольный идентификатор; поле `name` - это публичное
# имя цели для протокола api:// (TargetProviderName).
endpoints:
  smartholdem-node:
    protocol: "api"
    name: "node123-smartholdem"             # api://node123-smartholdem
    local_url: "http://localhost:4003/api"
    rate_limit_per_peer: 25                 # запросов в секунду на один PeerID

    # WebSocket-туннель (v0.5+): необязательный `local_ws_url` включает
    # поддержку `new WebSocket('ws://<nodeId>/<name>/<path>')` от dApp'ов.
    # Провайдер откроет tokio_tungstenite сессию к этому URL + path и будет
    # пайпить кадры между клиентом (через iroh bi-stream + WsFrame framing)
    # и апстримом. Без этого поля WS-запросы возвращают Close 1011.
    # Пример для узла SmartHoldem с realtime-WS: "ws://localhost:4004"
    # local_ws_url: "ws://localhost:4004"

    # Лимит WS-СООБЩЕНИЙ (frames) в секунду на PeerID - отдельный от
    # rate_limit_per_peer (тот ограничивает частоту handshake'ов).
    # 30 msgs/sec с запасом хватает игровому/чатному realtime.
    ws_rate_limit_per_peer: 30
